#
# Observability Stack OpenTelemetry Demo Services
# Runs the OpenTelemetry Demo application and sends telemetry to the Observability Stack OTLP endpoint.
#
# This is NOT a standalone Docker Compose file.
# It is included by docker-compose.yml via the 'include:' directive and
# depends on networks and services (otel-collector, prometheus, opensearch)
# defined in the main docker-compose.yml.
#
# To use: Set INCLUDE_COMPOSE_OTEL_DEMO=docker-compose.otel-demo.yml in .env
# Then run: docker compose up -d
#
# Service set tracks the OpenTelemetry Demo 3.0.0 core (compose.yaml).
# accounting, fraud-detection, kafka, llm, and product-reviews are not part of
# the core set and are omitted. Telemetry from every service targets the stack
# collector (OTEL_COLLECTOR_HOST) rather than the demo's bundled collector.

x-default-logging: &logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "2"
    tag: "{{.Name}}"

x-network: &network
  networks:
    - observability-stack-network

services:
  # ******************
  # Core Demo Services
  # ******************
  # AdService
  ad:
    image: ${IMAGE_NAME}:${DEMO_VERSION}-ad
    container_name: ad
    deploy:
      resources:
        limits:
          memory: 300M
    restart: unless-stopped
    ports:
      - "${AD_PORT}"
      - "${AD_PROMETHEUS_PORT}"
    environment:
      - AD_PORT
      - AD_PROMETHEUS_PORT
      - FLAGD_HOST
      - FLAGD_PORT
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://${OTEL_COLLECTOR_HOST}:${OTEL_COLLECTOR_PORT_HTTP}
      - OTEL_METRICS_EXPORTER
      - OTEL_LOGS_EXPORTER
      - OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES},service.criticality=medium
      - OTEL_SERVICE_NAME=ad
      - OTEL_EXPERIMENTAL_SDK_TELEMETRY_VERSION=latest
      # Workaround on OSX for https://bugs.openjdk.org/browse/JDK-8345296
      - _JAVA_OPTIONS
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/${AD_PORT}'"]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      otel-collector:
        condition: service_started
      flagd:
        condition: service_started
    <<: *network
    logging: *logging

  # Cart service
  cart:
    image: ${IMAGE_NAME}:${DEMO_VERSION}-cart
    container_name: cart
    deploy:
      resources:
        limits:
          memory: 160M
    restart: unless-stopped
    ports:
      - "${CART_PORT}"
    environment:
      - CART_PORT
      - FLAGD_HOST
      - FLAGD_PORT
      - VALKEY_ADDR
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_METRICS_EXPORTER
      - OTEL_LOGS_EXPORTER
      - OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES},service.criticality=high
      - OTEL_SERVICE_NAME=cart
      - ASPNETCORE_URLS=http://*:${CART_PORT}
    depends_on:
      valkey-cart:
        condition: service_healthy
      otel-collector:
        condition: service_started
      flagd:
        condition: service_started
    <<: *network
    logging: *logging

  # Checkout service
  checkout:
    image: ${IMAGE_NAME}:${DEMO_VERSION}-checkout
    container_name: checkout
    deploy:
      resources:
        limits:
          memory: 20M
    restart: unless-stopped
    ports:
      - "${CHECKOUT_PORT}"
    environment:
      - FLAGD_HOST
      - FLAGD_PORT
      - CHECKOUT_PORT
      - CART_ADDR
      - CURRENCY_ADDR
      - EMAIL_ADDR
      - PAYMENT_ADDR
      - PRODUCT_CATALOG_ADDR
      - SHIPPING_ADDR
      - GOMEMLIMIT=16MiB
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://${OTEL_COLLECTOR_HOST}:${OTEL_COLLECTOR_PORT_HTTP}
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_METRICS_EXPORTER
      - OTEL_LOGS_EXPORTER
      - OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES},service.criticality=critical
      - OTEL_SERVICE_NAME=checkout
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=:${CHECKOUT_PORT}"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      cart:
        condition: service_started
      currency:
        condition: service_healthy
      email:
        condition: service_healthy
      payment:
        condition: service_healthy
      product-catalog:
        condition: service_started
      shipping:
        condition: service_started
      otel-collector:
        condition: service_started
      flagd:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    <<: *network
    logging: *logging

  # Currency service
  currency:
    image: ${IMAGE_NAME}:${DEMO_VERSION}-currency
    container_name: currency
    deploy:
      resources:
        limits:
          memory: 20M
    restart: unless-stopped
    ports:
      - "${CURRENCY_PORT}"
    environment:
      - CURRENCY_PORT
      - IPV6_ENABLED
      - VERSION=${IMAGE_VERSION}
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_METRICS_EXPORTER
      - OTEL_LOGS_EXPORTER
      - OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES},service.criticality=high
      - OTEL_SERVICE_NAME=currency
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost ${CURRENCY_PORT}"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      otel-collector:
        condition: service_started
    <<: *network
    logging: *logging

  # Email service
  email:
    image: ${IMAGE_NAME}:${DEMO_VERSION}-email
    container_name: email
    deploy:
      resources:
        limits:
          memory: 100M
    restart: unless-stopped
    ports:
      - "${EMAIL_PORT}"
    environment:
      - APP_ENV=production
      - EMAIL_PORT
      - FLAGD_HOST
      - FLAGD_PORT
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://${OTEL_COLLECTOR_HOST}:${OTEL_COLLECTOR_PORT_HTTP}
      - OTEL_METRICS_EXPORTER
      - OTEL_LOGS_EXPORTER
      - OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES},service.criticality=medium
      - OTEL_SERVICE_NAME=email
    healthcheck:
      test: ["CMD", "ruby", "-e", "require 'socket'; TCPSocket.new('localhost', ${EMAIL_PORT}).close"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      otel-collector:
        condition: service_started
    <<: *network
    logging: *logging

  # Frontend
  frontend:
    image: ${IMAGE_NAME}:${DEMO_VERSION}-frontend
    container_name: frontend
    deploy:
      resources:
        limits:
          memory: 250M
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}"
    environment:
      - PORT=${FRONTEND_PORT}
      - FRONTEND_ADDR
      - AD_ADDR
      - CART_ADDR
      - CHECKOUT_ADDR
      - CURRENCY_ADDR
      - PRODUCT_CATALOG_ADDR
      - RECOMMENDATION_ADDR
      - SHIPPING_ADDR
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_METRICS_EXPORTER
      - OTEL_LOGS_EXPORTER
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES},service.criticality=critical
      - ENV_PLATFORM
      - OTEL_SERVICE_NAME=frontend
      - PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
      - OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
      - WEB_OTEL_SERVICE_NAME=frontend-web
      - OTEL_COLLECTOR_HOST
      - FLAGD_HOST
      - FLAGD_PORT
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "require('net').connect(${FRONTEND_PORT},require('os').hostname(),function(){process.exit(0)}).on('error',function(){process.exit(1)})"]
      start_period: 60s
      interval: 10s
      timeout: 10s
      retries: 5
    depends_on:
      ad:
        condition: service_healthy
      cart:
        condition: service_started
      checkout:
        condition: service_started
      currency:
        condition: service_healthy
      product-catalog:
        condition: service_started
      quote:
        condition: service_healthy
      recommendation:
        condition: service_healthy
      shipping:
        condition: service_started
      otel-collector:
        condition: service_started
      image-provider:
        condition: service_healthy
      flagd:
        condition: service_started
    <<: *network
    logging: *logging

  # Frontend Proxy (Envoy)
  frontend-proxy:
    image: ${IMAGE_NAME}:${DEMO_VERSION}-frontend-proxy
    container_name: frontend-proxy
    deploy:
      resources:
        limits:
          memory: 90M
    restart: unless-stopped
    ports:
      - "${ENVOY_PORT}:${ENVOY_PORT}"
      - "${ENVOY_ADMIN_PORT}:${ENVOY_ADMIN_PORT}"
    environment:
      - FRONTEND_PORT
      - FRONTEND_HOST
      - GRAFANA_PORT
      - GRAFANA_HOST
      - JAEGER_UI_PORT
      - JAEGER_HOST
      - CHATBOT_HOST
      - CHATBOT_PORT
      - FIREPIT_HOST
      - FIREPIT_PORT
      - OPAMP_SERVER_HOST
      - OPAMP_SERVER_UI_PORT
      - OTEL_COLLECTOR_HOST
      - IMAGE_PROVIDER_HOST
      - IMAGE_PROVIDER_PORT
      - OTEL_COLLECTOR_PORT_GRPC
      - OTEL_COLLECTOR_PORT_HTTP
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES},service.criticality=critical
      - OTEL_SERVICE_NAME=frontend-proxy
      - OTEL_SERVICE_NAMESPACE
      - ENVOY_PORT
      - ENVOY_ADDR
      - ENVOY_ADMIN_PORT
      - FLAGD_HOST
      - FLAGD_PORT
      - FLAGD_UI_HOST
      - FLAGD_UI_PORT
      - TELEMETRY_DOCS_HOST
      - TELEMETRY_DOCS_PORT
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/${ENVOY_PORT}"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      frontend:
        condition: service_healthy
      flagd-ui:
        condition: service_healthy
      telemetry-docs:
        condition: service_healthy
    <<: *network
    dns_search: ""

  # image-provider
  image-provider:
    image: ${IMAGE_NAME}:${DEMO_VERSION}-image-provider
    container_name: image-provider
    deploy:
      resources:
        limits:
          memory: 120M
    restart: unless-stopped
    ports:
      - "${IMAGE_PROVIDER_PORT}"
    environment:
      - IMAGE_PROVIDER_PORT
      - OTEL_COLLECTOR_HOST
      - OTEL_COLLECTOR_PORT_GRPC
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES},service.criticality=low
      - OTEL_SERVICE_NAME=image-provider
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${IMAGE_PROVIDER_PORT}/status"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      otel-collector:
        condition: service_started
    <<: *network
    logging: *logging

  # Load Generator (k6)
  load-generator:
    image: ${IMAGE_NAME}:${DEMO_VERSION}-load-generator
    container_name: load-generator
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    environment:
      - LOAD_GENERATOR_VUS
      - K6_TARGET_URL
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://${OTEL_COLLECTOR_HOST}:${OTEL_COLLECTOR_PORT_HTTP}
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_METRICS_EXPORTER
      - OTEL_LOGS_EXPORTER
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES},service.criticality=low
      - OTEL_SERVICE_NAME=load-generator
      - FLAGD_HOST
      - FLAGD_PORT
      - FLAGD_OFREP_PORT
      - K6_OTEL_EXPORTER_PROTOCOL=http/protobuf
      - K6_OTEL_HTTP_EXPORTER_ENDPOINT=${OTEL_COLLECTOR_HOST}:${OTEL_COLLECTOR_PORT_HTTP}
      - K6_OTEL_HTTP_EXPORTER_INSECURE=true
      - K6_BROWSER_ENABLED=true
      - K6_BROWSER_ARGS=no-sandbox,disable-dev-shm-usage
      - K6_OTEL_METRIC_PREFIX=k6.
    healthcheck:
      test: ["CMD-SHELL", "pgrep k6"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      frontend:
        condition: service_healthy
      frontend-proxy:
        condition: service_healthy
      flagd:
        condition: service_started
    <<: *network
    logging: *logging

  # Payment service
  payment:
    image: ${IMAGE_NAME}:${DEMO_VERSION}-payment
    container_name: payment
    deploy:
      resources:
        limits:
          memory: 140M
    restart: unless-stopped
    ports:
      - "${PAYMENT_PORT}"
    environment:
      - IPV6_ENABLED
      - PAYMENT_PORT
      - FLAGD_HOST
      - FLAGD_PORT
      - NODE_OPTIONS=--require @opentelemetry/auto-instrumentations-node/register
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_METRICS_EXPORTER
      - OTEL_LOGS_EXPORTER
      - OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES},service.criticality=critical
      - OTEL_SERVICE_NAME=payment
    healthcheck:
      test:
        - "CMD"
        - "/nodejs/bin/node"
        - "-e"
        - >-
          const net=require('net');const c=new net.Socket();
          c.setTimeout(2000);
          c.connect(${PAYMENT_PORT},'127.0.0.1',()=>{c.destroy();process.exit(0)});
          c.on('error',()=>process.exit(1));
          c.on('timeout',()=>process.exit(1))
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      otel-collector:
        condition: service_started
      flagd:
        condition: service_started
    <<: *network
    logging: *logging

  # Product Catalog service
  product-catalog:
    image: ${IMAGE_NAME}:${DEMO_VERSION}-product-catalog
    container_name: product-catalog
    deploy:
      resources:
        limits:
          memory: 20M
    restart: unless-stopped
    ports:
      - "${PRODUCT_CATALOG_PORT}"
    environment:
      - PRODUCT_CATALOG_PORT
      - FLAGD_HOST
      - FLAGD_PORT
      - GOMEMLIMIT=16MiB
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_METRICS_EXPORTER
      - OTEL_LOGS_EXPORTER
      - OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES},service.criticality=high
      - OTEL_SERVICE_NAME=product-catalog
      - OTEL_CONFIG_FILE=/otel-config.yml
      - OTEL_SEMCONV_STABILITY_OPT_IN=database
      - DB_CONNECTION_STRING=postgres://astronomy_user:${POSTGRES_ASTRONOMY_PASSWORD}@${POSTGRES_HOST}/astronomy_db?sslmode=disable
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=:${PRODUCT_CATALOG_PORT}"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      otel-collector:
        condition: service_started
      flagd:
        condition: service_started
      astronomy-db:
        condition: service_healthy
    volumes:
      - ./docker-compose/opentelemetry-demo/src/product-catalog/otel-config.yml:/otel-config.yml
    read_only: true
    tmpfs:
      - /tmp
    <<: *network
    logging: *logging

  # Quote service
  quote:
    image: ${IMAGE_NAME}:${DEMO_VERSION}-quote
    container_name: quote
    deploy:
      resources:
        limits:
          memory: 40M
    restart: unless-stopped
    ports:
      - "${QUOTE_PORT}"
    environment:
      - IPV6_ENABLED
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://${OTEL_COLLECTOR_HOST}:${OTEL_COLLECTOR_PORT_HTTP}
      - OTEL_METRICS_EXPORTER
      - OTEL_LOGS_EXPORTER
      - OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
      - OTEL_PHP_AUTOLOAD_ENABLED=true
      - QUOTE_PORT
      - OTEL_PHP_INTERNAL_METRICS_ENABLED=true
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES},service.criticality=low
      - OTEL_SERVICE_NAME=quote
    healthcheck:
      test: ["CMD", "php", "-r", "fsockopen('localhost', ${QUOTE_PORT}) or die('fail');"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      otel-collector:
        condition: service_started
    <<: *network
    logging: *logging

  # Recommendation service
  recommendation:
    image: ${IMAGE_NAME}:${DEMO_VERSION}-recommendation
    container_name: recommendation
    deploy:
      resources:
        limits:
          memory: 500M               # This is high to enable supporting the recommendationCache feature flag use case
    restart: unless-stopped
    ports:
      - "${RECOMMENDATION_PORT}"
    environment:
      - RECOMMENDATION_PORT
      - PRODUCT_CATALOG_ADDR
      - FLAGD_HOST
      - FLAGD_PORT
      - OTEL_PYTHON_LOG_CORRELATION=true
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_METRICS_EXPORTER
      - OTEL_LOGS_EXPORTER
      - OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES},service.criticality=medium
      - OTEL_SERVICE_NAME=recommendation
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost ${RECOMMENDATION_PORT}"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      product-catalog:
        condition: service_started
      otel-collector:
        condition: service_started
      flagd:
        condition: service_started
    <<: *network
    logging: *logging

  # Shipping service
  shipping:
    image: ${IMAGE_NAME}:${DEMO_VERSION}-shipping
    container_name: shipping
    deploy:
      resources:
        limits:
          memory: 20M
    restart: unless-stopped
    ports:
      - "${SHIPPING_PORT}"
    environment:
      - IPV6_ENABLED
      - SHIPPING_PORT
      - QUOTE_ADDR
      - FLAGD_HOST
      - FLAGD_PORT
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://${OTEL_COLLECTOR_HOST}:${OTEL_COLLECTOR_PORT_HTTP}
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_METRICS_EXPORTER
      - OTEL_LOGS_EXPORTER
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES},service.criticality=high
      - OTEL_SERVICE_NAME=shipping
      - OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      otel-collector:
        condition: service_started
      flagd:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    <<: *network
    logging: *logging

  # Telemetry Documentation service
  telemetry-docs:
    image: ${IMAGE_NAME}:${DEMO_VERSION}-telemetry-docs
    container_name: telemetry-docs
    deploy:
      resources:
        limits:
          memory: 100M
    restart: unless-stopped
    ports:
      - "${TELEMETRY_DOCS_PORT}"
    environment:
      - TELEMETRY_DOCS_PORT
      - OTEL_COLLECTOR_HOST
      - OTEL_COLLECTOR_PORT_GRPC
      - OTEL_SERVICE_NAME=telemetry-docs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${TELEMETRY_DOCS_PORT}/"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20
    <<: *network
    logging: *logging

  # ******************
  # Dependent Services
  # ******************
  # Flagd, feature flagging service
  flagd:
    image: ${FLAGD_IMAGE}
    container_name: flagd
    deploy:
      resources:
        limits:
          memory: 75M
    restart: unless-stopped
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://${OTEL_COLLECTOR_HOST}:${OTEL_COLLECTOR_PORT_HTTP}
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - GOMEMLIMIT=60MiB
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES},service.criticality=low
      - OTEL_SERVICE_NAME=flagd
    command: [
      "start",
      "--uri",
      "file:./etc/flagd/demo.flagd.json"
    ]
    ports:
      - "${FLAGD_PORT}"
      - "${FLAGD_OFREP_PORT}"
    volumes:
      - ./docker-compose/opentelemetry-demo/src/flagd:/etc/flagd
    <<: *network
    logging: *logging

  # Flagd UI for configuring the feature flag service
  flagd-ui:
    image: ${IMAGE_NAME}:${DEMO_VERSION}-flagd-ui
    container_name: flagd-ui
    deploy:
      resources:
        limits:
          memory: 200M
    restart: always
    environment:
      - FLAGD_UI_PORT
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://${OTEL_COLLECTOR_HOST}:${OTEL_COLLECTOR_PORT_HTTP}
      - OTEL_METRICS_EXPORTER
      - OTEL_LOGS_EXPORTER
      - OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES},service.criticality=low
      - OTEL_SERVICE_NAME=flagd-ui
      - SECRET_KEY_BASE=yYrECL4qbNwleYInGJYvVnSkwJuSQJ4ijPTx5tirGUXrbznFIBFVJdPl5t6O9ASw
      - PHX_HOST=localhost
    ports:
      - "${FLAGD_UI_PORT}"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/${FLAGD_UI_PORT}"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      otel-collector:
        condition: service_started
      flagd:
        condition: service_started
    volumes:
      - ./docker-compose/opentelemetry-demo/src/flagd:/app/data
    <<: *network

  # PostgreSQL database for the astronomy demo
  astronomy-db:
    image: ${POSTGRES_IMAGE}
    container_name: astronomy-db
    deploy:
      resources:
        limits:
          memory: 80M
    restart: unless-stopped
    ports:
      - ${POSTGRES_PORT}
    command: postgres -c shared_preload_libraries=pg_stat_statements
    environment:
      - POSTGRES_PASSWORD
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./docker-compose/opentelemetry-demo/src/postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
    <<: *network
    logging: *logging

  # Valkey used by Cart service
  valkey-cart:
    image: ${VALKEY_IMAGE}
    container_name: valkey-cart
    user: valkey
    deploy:
      resources:
        limits:
          memory: 20M
    restart: unless-stopped
    ports:
      - "${VALKEY_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping"]
      start_period: 5s
      interval: 5s
      timeout: 3s
      retries: 10
    <<: *network
    logging: *logging

  # ******************
  # Demo-only Alerting Extensions
  # ******************
  # Demo-only one-shot loader for OTel Demo alerting:
  #   1. Cortex ruler rules from /rules/otel_demo
  #   2. OpenSearch alerting monitors for demo traces/logs (checkout, payment, …)
  # Mirrors the base `alerting-rules-monitors-init` container — both stages run
  # regardless of each other's outcome and the container exits non-zero on any
  # failure. Named separately from the base container rather than overlaying it
  # because Docker Compose >= v2.38 rejects service-name overlays on
  # `include:`-imported resources. Both containers hit idempotent upsert APIs.
  # Requires local Cortex (prometheus) and OpenSearch backends; gated behind
  # the local-backends profile (see COMPOSE_PROFILES in .env).
  otel-demo-alerting-rules-monitors-init:
    profiles: ["local-backends"]
    image: python:3.11-alpine
    container_name: otel-demo-alerting-rules-monitors-init
    command:
      - sh
      - -c
      - |
        pip install requests pyyaml || exit 1
        fail=0
        echo "=== Loading Cortex rules (otel_demo) ==="
        python /init-cortex-rules.py || fail=1
        echo "=== Creating OpenSearch monitors (otel_demo) ==="
        python /init-otel-demo-monitors.py || fail=1
        exit $$fail
    depends_on:
      prometheus:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      - OPENSEARCH_USER=${OPENSEARCH_USER}
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD}
    volumes:
      - ./docker-compose/cortex/init-cortex-rules.py:/init-cortex-rules.py
      - ./docker-compose/prometheus/rules-otel-demo:/rules/otel_demo:ro
      - ./docker-compose/opentelemetry-demo/init-otel-demo-monitors.py:/init-otel-demo-monitors.py
    <<: *network
    restart: "no"
    logging: *logging
