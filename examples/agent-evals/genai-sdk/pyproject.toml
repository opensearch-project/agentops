[project]
name = "agent-evals-genai-sdk"
version = "0.1.0"
description = "Run evaluations against stored agent traces in OpenSearch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opensearch-genai-observability-sdk-py[opensearch]>=0.2.7",
    "strands-agents-evals[opensearch]>=0.1.15",
]

[tool.uv]
constraint-dependencies = ["starlette>=1.3.1", "idna>=3.15", "aiohttp>=3.14.3", "cryptography>=50.0.0"]
